<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PrintForm Server</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="page">
      <header class="header">
        <h1>PrintForm Cloud Queue</h1>
        <p>Pilih kios tujuan sebelum mengirim dokumen.</p>
        <p id="realtimeStatus" class="muted">Realtime: menghubungkan...</p>
      </header>

      <section class="card" id="sessionCard">
        <h2>Session Print</h2>
        <div>
          <label class="field">
            <span>Alias Pengirim</span>
            <input type="text" id="aliasInput" placeholder="Nama pengirim (opsional)">
          </label>
          <div class="row">
            <button id="saveAliasBtn" type="button">Simpan Alias</button>
            <button id="clearAliasBtn" type="button">Hapus Alias</button>
          </div>
          <label class="field">
            <span>Tujuan Kios</span>
            <select id="clientSelect" required>
              <option value="">Memuat daftar kios...</option>
            </select>
          </label>
          <button id="startSessionBtn" type="button">Mulai Session</button>
          <div id="sessionStatus" class="status"></div>
        </div>
      </section>

      <section class="card">
        <h2>Daftar Kios Percetakan</h2>
        <table>
          <thead>
            <tr>
              <th>Nama Kios</th>
              <th>Kesiapan</th>
              <th>Client Terdaftar</th>
              <th>Client Online</th>
              <th>Client Siap</th>
              <th>Bisa Mulai Session</th>
            </tr>
          </thead>
          <tbody id="clientsBody">
            <tr>
              <td colspan="6" class="muted">Belum ada kios.</td>
            </tr>
          </tbody>
        </table>
        <div id="clientsStatus" class="status"></div>
      </section>
    </main>

    <script type="module" src="/home/index.js"></script>
  </body>
</html>
