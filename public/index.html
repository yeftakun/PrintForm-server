<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PrintForm Server</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="page">
      <header class="header">
        <h1>PrintForm Cloud Queue</h1>
        <p>Masukkan kode toko atau scan QR untuk mulai mengirim dokumen.</p>
      </header>

      <section class="card" id="storeSearchCard">
        <h2>Cari Toko</h2>
        <form id="storeSearchForm">
          <label class="field">
            <span>Alias Pengirim</span>
            <input type="text" id="aliasInput" placeholder="Nama pengirim (opsional)">
          </label>
          <div class="row">
            <button id="saveAliasBtn" type="button">Simpan Alias</button>
            <button id="clearAliasBtn" type="button">Hapus Alias</button>
          </div>
          <label class="field">
            <span>Kode Toko</span>
            <input type="text" id="storeCodeInput" placeholder="Contoh: TOKO-001" autocomplete="off" required>
          </label>
          <div class="row">
            <button id="searchStoreBtn" type="submit">Cari Toko</button>
            <button id="scanQrBtn" type="button">Scan QR</button>
          </div>
          <div id="storeSearchStatus" class="status"></div>
        </form>
      </section>
    </main>

    <script type="module" src="/home/index.js"></script>
  </body>
</html>
